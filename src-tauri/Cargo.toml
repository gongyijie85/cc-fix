[package]
name = "cc-fix-desktop"
version = "0.2.0-rc.1"
description = "CC-Fix Windows desktop shell"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.3"
uuid = { version = "1.18", features = ["v4"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
