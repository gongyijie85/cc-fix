name: Draft Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0-rc.1)
        required: true
        type: string
      allow_unsigned_rc:
        description: Explicitly allow an unsigned release candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  draft:
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Verify tag and unsigned policy
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ALLOW_UNSIGNED_RC: ${{ inputs.allow_unsigned_rc }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag/version mismatch: $env:RELEASE_TAG vs $version" }
          if ($version -notmatch '-rc\.' -and $env:ALLOW_UNSIGNED_RC -eq 'true') { throw 'Stable releases cannot use the unsigned-RC exception' }
          if ($version -match '-rc\.' -and $env:ALLOW_UNSIGNED_RC -ne 'true') { throw 'No signing identity is configured; explicitly approve the unsigned RC exception' }
          if ((git status --porcelain).Length -ne 0) { throw 'Release checkout is not clean' }
      - name: Pin Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:validate
      - run: pnpm test
      - run: pnpm test:coverage
      - run: cargo test --locked --manifest-path native-helper/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $lock = Get-Content toolchain.lock.json -Raw | ConvertFrom-Json
          $setup = Join-Path $env:RUNNER_TEMP 'inno.exe'
          Invoke-WebRequest $lock.tools.innoSetup.source -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.tools.innoSetup.sha256) { throw 'Inno digest mismatch' }
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -WindowStyle Hidden -Wait
      - run: pnpm release:bundle
        env:
          CC_FIX_SIGNING_STATUS: unsigned
      - run: pnpm verify:evidence
      - run: pnpm test:windows
      - name: Collect checksums from the tagged build
        shell: pwsh
        run: |
          $info = Get-Content release/evidence/build-info.json -Raw | ConvertFrom-Json
          if ($info.sourceTreeDirty -or $info.commit -ne $env:GITHUB_SHA -or $env:GITHUB_REF_NAME -ne "v$($info.version)") { throw 'Release source does not match the clean workflow tag' }
          $assets = @(Get-Item "release/installer/$($info.installer.file)") + @(Get-ChildItem release/evidence -File)
          $assets | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release/evidence/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Attest installer and evidence
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/installer/CC-Fix-Setup-*.exe
            release/evidence/*
      - name: Verify artifact provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          $assets = @(Get-ChildItem release/installer/CC-Fix-Setup-*.exe) + @(Get-ChildItem release/evidence -File)
          foreach ($asset in $assets) {
            gh attestation verify $asset.FullName --bundle $env:BUNDLE --repo $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --source-ref $env:GITHUB_REF
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed: $($asset.Name)" }
          }
      - name: Create immutable-ready draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = @"
          CC-Fix $version Windows release candidate.

          ⚠ This RC is not Authenticode-signed. Verify the published SHA-256 and GitHub artifact attestation before installation. Windows SmartScreen may show an unknown-publisher warning.

          VPN, router, route, network-adapter, DNS, hosts and DoH configuration are detection/reminder-only and are never modified.
          "@
          # `gh release create`/`gh release upload` 一次性捆绑多文件会在 uploads.github.com 稳定 404
          # （本地逐文件探针均成功，判定为 CI GITHUB_TOKEN 下多文件上传会话的偶发问题）。
          # 改为「逐文件单独上传」= 每次一个文件一个上传请求，规避该问题。
          gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --title "CC-Fix $version" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          $assetFiles = @()
          $assetFiles += @(Get-ChildItem 'release/installer/CC-Fix-Setup-*.exe')
          $assetFiles += @(Get-ChildItem 'release/evidence/*')
          foreach ($asset in $assetFiles) {
            gh release upload "$env:RELEASE_TAG" $asset.FullName
            if ($LASTEXITCODE -ne 0) { throw "Asset upload failed: $($asset.Name)" }
          }
