<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC-Fix 环境安全检测</title>
<link rel="preload" href="/assets/fonts/cc-fix-noto-sans-sc.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/gui/app.css">
</head>
<body>
<div class="container">
  <header>
    <h1><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm0 3.1 5 1.9v4c0 3.5-2.2 6.9-5 8-2.8-1.1-5-4.5-5-8V7l5-1.9Z"/></svg> CC-Fix 环境安全检测</h1>
    <p>Claude Code 环境风险可视化面板</p>
  </header>
  <div class="status-bar" role="status" aria-live="polite" aria-label="环境状态">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">检测中...</span>
  </div>

  <!-- 修复流卡片 -->
  <div class="fix-card" id="fixCard">
    <h3 id="fixTitle">修复进行中…</h3>
    <div id="stepList"></div>
    <div class="sum-bar" id="sumBar"></div>
    <div class="browser-hint" id="browserHint"></div>
<div class="signals fonts-panel" id="fontsPanel">
  <p id="fontsStatus"></p>
  <div class="inline-actions">
    <button class="btn" id="btnFontsRestore"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v3H4V5Zm2 5h12v3H6v-3Zm3 5h6v3H9v-3Z"/></svg> 还原中文字体</button>
  </div>
</div>
  </div>

  <!-- 检测流卡片 -->
  <div class="detect-card" id="detectCard">
    <h3 id="detectTitle">检测进行中…</h3>
    <div id="detectList"></div>
  </div>

  <div id="content"><div class="loading"><div class="spinner"></div><p>正在检测环境...</p></div></div>

  <!-- 最近操作面板 -->
  <details class="history-panel" id="historyPanel">
    <summary><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.7 5H3l3-3 3 3H7.3A5 5 0 1 0 12 7V5Zm-1 3h2v4l3 2-1 1-4-2.7V8Z"/></svg> 最近操作</summary>
    <div id="historyList"></div>
  </details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-label="通知"></div>
<script type="module" src="/assets/gui/app.js"></script>
</body>
</html>
