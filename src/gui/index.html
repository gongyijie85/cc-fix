<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC-Fix 环境安全检测</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
    --text: #e4e4e7; --muted: #71717a; --accent: #6366f1;
    --green: #22c55e; --yellow: #eab308; --red: #ef4444; --orange: #f97316;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 显式加入中文字体，避免仅 Segoe UI / monospace 时 CJK 字形回退失败（豆腐块/部分丢失） */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
      "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Micro Hei",
      "Hiragino Sans GB", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-size: 24px; font-weight: 600; }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .score-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px; }
  .score-value { font-size: 56px; font-weight: 700; line-height: 1; }
  .score-label { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .score-low { color: var(--green); } .score-medium { color: var(--yellow); }
  .score-high { color: var(--orange); } .score-critical { color: var(--red); }
  .ip-info { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; }
  .ip-info h3 { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .ip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .ip-item { font-size: 13px; } .ip-item span { color: var(--muted); }
  .signals { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
  .signals h3 { padding: 12px 20px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 16px; font-size: 12px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  td { padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .risk-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 12px; font-weight: 500; }
  .risk-low { background: rgba(34,197,94,.15); color: var(--green); }
  .risk-medium { background: rgba(234,179,8,.15); color: var(--yellow); }
  .risk-high { background: rgba(239,68,68,.15); color: var(--red); }
  .risk-critical { background: rgba(239,68,68,.2); color: var(--red); }
  .contrib { font-weight: 600; font-size: 13px; }
  .contrib-zero { color: var(--green); } .contrib-nonzero { color: var(--red); }
  .actions { display: flex; gap: 12px; margin-bottom: 24px; }
  .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; line-height: 1.4; }
  .btn small { display: block; font-size: 11px; font-weight: 400; opacity: .75; margin-top: 2px; }
  .btn:hover { opacity: .85; } .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-on { background: var(--green); color: #000; } .btn-off { background: var(--red); color: #fff; }
  .btn-refresh { background: var(--accent); color: #fff; }
  .recommendations { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .recommendations h3 { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .recommendations li { font-size: 13px; margin-left: 16px; margin-bottom: 4px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.on { background: var(--green); } .status-dot.off { background: var(--muted); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: #000; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* ── 修复流卡片 ── */
  .fix-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; display: none; }
  .fix-card.visible { display: block; }
  .fix-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .step-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .step-row:last-child { border-bottom: none; }
  .step-circle { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; margin-top: 2px; }
  .step-circle.pending { border: 2px solid var(--muted); }
  .step-circle.running { border: 2px solid var(--accent); animation: pulse 1s ease-in-out infinite; }
  .step-circle.ok { background: var(--green); color: #000; }
  .step-circle.fail { background: var(--red); color: #fff; }
  .step-circle.rollback { background: var(--orange); color: #000; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .step-body { flex: 1; min-width: 0; }
  .step-name { font-size: 14px; font-weight: 500; }
  .step-change {
    font-family: "SF Mono", "Cascadia Code", Consolas, "Microsoft YaHei UI", "Microsoft YaHei",
      "Noto Sans SC", "Noto Sans Mono CJK SC", monospace;
    font-size: 12px; color: var(--muted); margin-top: 2px;
  }
  .step-change b { color: var(--text); font-weight: 600; }
  .step-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; white-space: nowrap; margin-top: 3px; }
  .badge-ok { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-fail { background: rgba(239,68,68,.15); color: var(--red); }
  .badge-rollback { background: rgba(249,115,22,.15); color: var(--orange); }
  .err-box {
    background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3); border-radius: 6px;
    padding: 6px 10px; margin-top: 6px;
    font-family: Consolas, "Cascadia Code", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", monospace;
    font-size: 12px; color: var(--red);
  }
  .sum-bar { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; }
  .sum-bar .count { padding: 2px 8px; border-radius: 9999px; font-weight: 600; font-size: 12px; }
  .sum-ok { background: rgba(34,197,94,.15); color: var(--green); }
  .sum-fail { background: rgba(239,68,68,.15); color: var(--red); }
  .sum-rollback { background: rgba(249,115,22,.15); color: var(--orange); }
  .score-delta { margin-left: auto; font-weight: 700; font-size: 15px; color: var(--green); }

  /* 浏览器重启生效提示（ADR-0003）：浏览器运行中时加强显示 */
  .browser-hint { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.35); color: var(--text); }
  .browser-hint.visible { display: block; }
  .browser-hint.strong { background: rgba(234,179,8,.12); border-color: rgba(234,179,8,.5); color: var(--yellow); font-weight: 700; }

  /* ── 检测流面板 ── */
  .detect-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; display: none; }
  .detect-card.visible { display: block; }
  .detect-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .detect-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .detect-row:last-child { border-bottom: none; }
  .detect-label { width: 140px; color: var(--muted); flex-shrink: 0; }
  .detect-value { flex: 1; }
  .detect-status { width: 60px; text-align: right; }
  .detect-pending { color: var(--muted); font-style: italic; }
  .detect-flash { animation: flash .6s ease; }
  @keyframes flash { 0% { background: rgba(99,102,241,.2); } 100% { background: transparent; } }

  /* 最近操作面板 */
  .history-panel { margin-top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .history-panel summary { cursor: pointer; color: var(--muted); font-size: 14px; user-select: none; }
  .history-panel summary:hover { color: var(--text); }
  .history-row { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; font-size: 13px; }
  .history-row + .history-row { border-top: 1px solid var(--border); }
  .history-time { color: var(--muted); flex-shrink: 0; }
  .history-action { color: var(--text); }
  .history-result { margin-left: auto; color: var(--muted); }
  .history-result.ok { color: var(--green); }
  .history-result.fail { color: var(--red); }
  .history-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  /* 地区选择器 */
  .region-select { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .region-select label { color: var(--muted); }
  .region-select select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .region-select select:disabled { opacity: .5; cursor: not-allowed; }
  .region-hint { color: var(--yellow); font-size: 12px; display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🛡️ CC-Fix 环境安全检测</h1>
    <p>Claude Code 环境风险可视化面板</p>
  </header>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">检测中...</span>
  </div>

  <!-- 修复流卡片 -->
  <div class="fix-card" id="fixCard">
    <h3 id="fixTitle">修复进行中…</h3>
    <div id="stepList"></div>
    <div class="sum-bar" id="sumBar" style="display:none"></div>
    <div class="browser-hint" id="browserHint"></div>
  </div>

  <!-- 检测流卡片 -->
  <div class="detect-card" id="detectCard">
    <h3 id="detectTitle">检测进行中…</h3>
    <div id="detectList"></div>
  </div>

  <div id="content"><div class="loading"><div class="spinner"></div><p>正在检测环境...</p></div></div>

  <!-- 最近操作面板 -->
  <details class="history-panel" id="historyPanel">
    <summary>🕘 最近操作</summary>
    <div id="historyList"></div>
  </details>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const riskLabel = { low: "安全", medium: "中风险", high: "高风险", critical: "极高风险" };
const scoreClass = (s) => s >= 71 ? "score-critical" : s >= 51 ? "score-high" : s >= 21 ? "score-medium" : "score-low";

// ── 检测信号占位表（13 行） ──
const DETECT_SIGNALS = [
  { id: "timezone", label: "时区" },
  { id: "language", label: "语言" },
  { id: "locale", label: "Locale" },
  { id: "consistency", label: "一致性" },
  { id: "fonts", label: "字体" },
  { id: "dns", label: "DNS" },
  { id: "base-url", label: "Base URL" },
  { id: "proxy-env", label: "代理环境" },
  { id: "win-region", label: "Windows 区域" },
  { id: "utc-offset", label: "UTC 偏移" },
  { id: "browser-policy", label: "浏览器策略" },
  { id: "ip-datacenter", label: "数据中心 IP" },
  { id: "ip-multi-source", label: "多源不一致" },
];

let fixActive = false; // 修复流是否进行中（防止每个 step-start 重复初始化卡片）
let lastFixAction = null;      // "on" | "off" — summary 时决定提示显示/消失
let pendingBrowserHint = null; // 服务端推送的运行中浏览器（null = 本流未写入策略）

// ── Toast ──
function showToast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// ── 按钮禁用 ──
function setButtonsDisabled(d) {
  ["btnOn", "btnOff", "btnRecover", "btnRefresh", "regionSelect", "levelSelect"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = d;
  });
}

// ── 修复流卡片 ──
function ensureFixCard() {
  const card = $("#fixCard");
  card.classList.add("visible");
  $("#fixTitle").textContent = "修复进行中…";
  $("#stepList").innerHTML = "";
  $("#sumBar").style.display = "none";
  $("#sumBar").innerHTML = "";
  const hint = $("#browserHint");
  hint.classList.remove("visible", "strong");
  hint.textContent = "";
  pendingBrowserHint = null;
}

function addStepRow(event) {
  const list = $("#stepList");
  const changeHtml = event.oldValue !== undefined
    ? `<div class="step-change">${esc(event.oldValue)} → <b>${esc(event.newValue)}</b></div>`
    : "";
  const rollbackClass = event.rollback ? " rollback" : "";
  list.insertAdjacentHTML("beforeend", `
    <div class="step-row" id="step-${esc(event.stepId)}">
      <div class="step-circle running${rollbackClass}" id="circle-${esc(event.stepId)}">…</div>
      <div class="step-body">
        <div class="step-name">${esc(event.name)}</div>
        ${changeHtml}
      </div>
    </div>`);
}

function updateStep(stepId, status, rollback, error) {
  const circle = document.getElementById(`circle-${stepId}`);
  const row = document.getElementById(`step-${stepId}`);
  if (!circle || !row) return;

  const isRollback = rollback || circle.classList.contains("rollback");
  circle.classList.remove("running");

  if (status === "ok") {
    circle.className = `step-circle ok${isRollback ? " rollback" : ""}`;
    circle.textContent = "✓";
    const badge = document.createElement("span");
    badge.className = `step-badge ${isRollback ? "badge-rollback" : "badge-ok"}`;
    badge.textContent = isRollback ? "已回滚" : "成功";
    const body = row.querySelector(".step-body");
    body.appendChild(badge);
  } else {
    circle.className = "step-circle fail";
    circle.textContent = "✗";
    const badge = document.createElement("span");
    badge.className = "step-badge badge-fail";
    badge.textContent = "失败";
    const body = row.querySelector(".step-body");
    body.appendChild(badge);
    if (error) {
      const errBox = document.createElement("div");
      errBox.className = "err-box";
      errBox.textContent = error;
      body.appendChild(errBox);
    }
  }
}

function showSummary(event) {
  const bar = $("#sumBar");
  bar.style.display = "flex";
  let html = `<span class="count sum-ok">${event.ok} 成功</span>`;
  if (event.fail > 0) html += `<span class="count sum-fail">${event.fail} 失败</span>`;
  if (event.rolledBack) html += `<span class="count sum-rollback">已回滚</span>`;
  bar.innerHTML = html;

  const title = $("#fixTitle");
  if (event.fatal) {
    title.textContent = "修复失败，需手动检查";
    title.style.color = "var(--red)";
  } else if (event.rolledBack) {
    title.textContent = "修复失败，已恢复原状";
    title.style.color = "var(--orange)";
  } else {
    title.textContent = "修复完成";
    title.style.color = "var(--green)";
  }

  setButtonsDisabled(false);

  // 浏览器策略生效提示：on 流写入策略后显示；off 后消失（ADR-0003）
  const hint = $("#browserHint");
  if (lastFixAction === "off") {
    hint.classList.remove("visible", "strong");
    hint.textContent = "";
  } else if (lastFixAction === "on" && pendingBrowserHint !== null && !event.fatal) {
    const running = pendingBrowserHint;
    hint.classList.add("visible");
    if (running.length > 0) {
      // 浏览器运行中：加强显示，新策略不会立即生效
      hint.classList.add("strong");
      const names = running.map(b => b === "chrome" ? "Chrome" : "Edge").join("、");
      hint.textContent = `⚠️ 浏览器策略已写入，但检测到 ${names} 正在运行 — 请重启浏览器后新策略才生效`;
    } else {
      hint.classList.remove("strong");
      hint.textContent = "浏览器策略已写入，请重启 Chrome/Edge 生效";
    }
  }
  pendingBrowserHint = null;

  // 成功后自动复测（评分对比由服务端 recheck 事件推送）
  if (event.fail === 0) {
    setTimeout(() => startCheck(), 500);
  }
}

function showScoreDelta(before, after) {
  const bar = $("#sumBar");
  bar.insertAdjacentHTML("beforeend",
    `<span class="score-delta">${before} → ${after}</span>`);
}

// ── 检测流面板 ──
function buildDetectTable() {
  const card = $("#detectCard");
  card.classList.add("visible");
  $("#detectTitle").textContent = "检测进行中…";
  const list = $("#detectList");
  list.innerHTML = "";
  for (const sig of DETECT_SIGNALS) {
    list.insertAdjacentHTML("beforeend", `
      <div class="detect-row" id="detect-${sig.id}">
        <div class="detect-label">${sig.label}</div>
        <div class="detect-value detect-pending" id="dv-${sig.id}">检测中…</div>
        <div class="detect-status" id="ds-${sig.id}"></div>
      </div>`);
  }
}

function fillDetectRow(signal) {
  const valEl = document.getElementById(`dv-${signal.id}`);
  const statusEl = document.getElementById(`ds-${signal.id}`);
  const row = document.getElementById(`detect-${signal.id}`);
  if (!valEl || !statusEl || !row) return;

  valEl.textContent = signal.value || "N/A";
  valEl.classList.remove("detect-pending");
  statusEl.innerHTML = `<span class="risk-badge risk-${signal.risk}">${riskLabel[signal.risk]}</span>`;
  row.classList.add("detect-flash");
}

function showDetectDone(response) {
  $("#detectTitle").textContent = "检测完成";
  setTimeout(() => {
    $("#detectCard").classList.remove("visible");
  }, 1500);
  render(response);
}

// ── 最近操作 ──
const historyActionLabel = { "persist-on": "一键切换到安全环境", "persist-off": "一键还原日常配置", "check": "重新检测" };

function renderHistoryRow(entry) {
  const time = new Date(entry.timestamp);
  const timeStr = isNaN(time)
    ? esc(entry.timestamp)
    : time.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  const label = historyActionLabel[entry.action] || esc(entry.action);
  let result, cls = "";
  if (entry.action === "check") {
    result = `评分 ${entry.score ?? "-"}`;
  } else if (entry.fatal) {
    result = "致命错误"; cls = "fail";
  } else if (entry.fail > 0) {
    result = `${entry.ok} 成功 · ${entry.fail} 失败${entry.rolledBack ? " · 已回滚" : ""}`; cls = "fail";
  } else {
    result = `${entry.ok} 成功`; cls = "ok";
  }
  return `<div class="history-row"><span class="history-time">${timeStr}</span><span class="history-action">${label}</span><span class="history-result ${cls}">${esc(result)}</span></div>`;
}

async function loadHistory() {
  try {
    const res = await fetch("/api/history");
    if (!res.ok) return;
    const entries = await res.json();
    $("#historyList").innerHTML = entries.length
      ? entries.map(renderHistoryRow).join("")
      : `<div class="history-empty">暂无操作记录</div>`;
  } catch { /* 面板为辅助功能，失败不阻断 */ }
}

// ── 事件处理 ──
function handleEvent(event) {
  if (event.type === "step-start") {
    if (!fixActive) { ensureFixCard(); fixActive = true; }
    addStepRow(event);
  }
  else if (event.type === "step-ok") { updateStep(event.stepId, "ok", event.rollback); }
  else if (event.type === "step-fail") { updateStep(event.stepId, "fail", event.rollback, event.error); }
  else if (event.type === "summary") { fixActive = false; showSummary(event); loadHistory(); }
  else if (event.type === "browser-hint") { pendingBrowserHint = event.running; }
  else if (event.type === "recheck") { showScoreDelta(event.before, event.after); }
  else if (event.type === "detect-start") { buildDetectTable(); }
  else if (event.type === "detect-ok") { fillDetectRow(event.signal); }
  else if (event.type === "detect-done") { showDetectDone(event.response); loadHistory(); }
  else if (event.type === "phase") {
    // 阶段提示（如 IP 情报获取中）
    if (!document.getElementById("detectCard").classList.contains("visible")) {
      buildDetectTable();
    }
  }
}

// ── SSE 连接 ──
const evtSource = new EventSource("/api/events");
evtSource.onmessage = (e) => {
  try { handleEvent(JSON.parse(e.data)); } catch (err) { console.error("事件处理错误:", err); }
};
evtSource.onerror = () => { /* EventSource 自动重连 */ };

// ── 操作按钮 ──
async function persistOn() {
  const region = document.getElementById("regionSelect")?.value || "us";
  const level = document.getElementById("levelSelect")?.value || "standard";
  if (level === "deep" && !confirm("深度保护会进一步修改 Windows Locale、首选语言列表和 Culture；关闭保护时会从耐久备份完整还原。是否继续？")) return;
  setButtonsDisabled(true);
  lastFixAction = "on";
  const res = await fetch(`/api/fix/on?region=${encodeURIComponent(region)}&level=${encodeURIComponent(level)}`, { method: "POST" });
  if (!res.ok) {
    setButtonsDisabled(false);
    showToast("已有操作进行中，请稍候");
  }
  // 事件流驱动 UI 更新
}

async function persistRecover() {
  setButtonsDisabled(true);
  lastFixAction = "recover";
  const res = await fetch("/api/fix/recover", { method: "POST" });
  if (!res.ok) {
    setButtonsDisabled(false);
    showToast("已有操作进行中，请稍候");
  }
}

async function persistOff() {
  setButtonsDisabled(true);
  lastFixAction = "off";
  const res = await fetch("/api/fix/off", { method: "POST" });
  if (!res.ok) {
    setButtonsDisabled(false);
    showToast("已有操作进行中，请稍候");
  }
}

function startCheck() {
  $("#detectCard").classList.add("visible");
  fetch("/api/check/start", { method: "POST" }).then(res => {
    if (!res.ok) {
      $("#detectCard").classList.remove("visible");
      showToast("已有操作进行中，请稍候");
    }
  });
}

function refresh() {
  $("#content").innerHTML = '<div class="loading"><div class="spinner"></div><p>正在检测...</p></div>';
  startCheck();
}

// ── 原有渲染逻辑 ──
const REGION_LABELS = { us: "🇺🇸 美国", eu: "🇪🇺 欧洲", jp: "🇯🇵 日本", sg: "🇸🇬 新加坡" };

// 地区选项来自服务端（与 CLI --region 同一事实源）；失败时保留静态 us 项
async function loadRegions() {
  const sel = document.getElementById("regionSelect");
  if (!sel) return;
  try {
    const res = await fetch("/api/regions");
    if (!res.ok) return;
    const data = await res.json();
    sel.innerHTML = data.regions.map(r => `<option value="${esc(r.code)}">${REGION_LABELS[r.code] || esc(r.code)}</option>`).join("");
    if (!sel.value || !data.regions.some(r => r.code === sel.value)) sel.value = data.default;
  } catch { /* 回落静态选项 */ }
}

async function loadStatus() {
  try {
    const res = await fetch("/api/status");
    const status = await res.json();
    const dot = $("#statusDot"), txt = $("#statusText");
    if (status.mode !== "daily") { dot.className = "status-dot on"; txt.textContent = `${status.mode} · ${status.health}`; }
    else { dot.className = "status-dot off"; txt.textContent = `daily · ${status.health}`; }
    const sel = document.getElementById("regionSelect");
    const hint = document.getElementById("regionHint");
    if (sel) { sel.disabled = false; sel.value = status.target?.region || status.preferredRegion || "us"; }
    const level = document.getElementById("levelSelect");
    if (level && status.mode !== "daily") level.value = status.mode;
    const needsRecovery = status.transaction?.kind !== "none" || status.health === "recovery_required";
    if (hint) { hint.style.display = needsRecovery ? "" : "none"; hint.textContent = "存在未完成事务，请先恢复"; }
    const recover = document.getElementById("btnRecover");
    if (recover) recover.style.display = needsRecovery ? "" : "none";
  } catch {}
}

function render(data) {
  const { score, riskLevel, signals, ipIntelligence: ip, recommendations } = data;
  const sorted = [...signals].sort((a, b) => b.contribution - a.contribution);
  const highCount = signals.filter(s => s.risk === "high" || s.risk === "critical").length;

  let html = `
    <div class="score-card">
      <div class="score-value ${scoreClass(score)}">${score}<span style="font-size:24px;color:var(--muted)">/100</span></div>
      <div class="score-label">风险评分 · ${riskLabel[riskLevel]}${highCount > 0 ? ` · ${highCount} 个高危` : ""}</div>
    </div>`;

  if (ip) {
    const ipTypeLabel = ip.ipType === "datacenter" ? '<span style="color:var(--red)">数据中心</span>' : ip.ipType === "residential" ? '<span style="color:var(--green)">住宅 ISP</span>' : ip.ipType;
    html += `<div class="ip-info"><h3>🌐 网络出口</h3><div class="ip-grid">
      <div class="ip-item"><span>IP:</span> ${ip.ip || "N/A"}</div>
      <div class="ip-item"><span>位置:</span> ${[ip.country, ip.city].filter(Boolean).join(" / ") || "N/A"}</div>
      <div class="ip-item"><span>ASN:</span> ${ip.asn || "N/A"}</div>
      <div class="ip-item"><span>类型:</span> ${ipTypeLabel}</div>
      <div class="ip-item"><span>多源:</span> ${ip.multiSourceConsistent ? '<span style="color:var(--green)">一致</span>' : '<span style="color:var(--red)">不一致</span>'}</div>
    </div></div>`;
  }

  html += `<div class="signals"><h3>📊 检测信号 (${signals.length})</h3><table><thead><tr><th>检测项</th><th>当前值</th><th>风险</th><th>分值</th></tr></thead><tbody>`;
  for (const s of sorted) {
    const val = s.value && s.value.length > 30 ? s.value.slice(0, 30) + "..." : (s.value || "N/A");
    html += `<tr><td>${s.label}</td><td style="color:var(--muted)">${val}</td><td><span class="risk-badge risk-${s.risk}">${riskLabel[s.risk]}</span></td><td class="contrib ${s.contribution > 0 ? "contrib-nonzero" : "contrib-zero"}">${s.contribution > 0 ? "+" + s.contribution : "+0"}</td></tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<div class="region-select">
    <label for="regionSelect">🌍 目标地区</label>
    <select id="regionSelect"><option value="us">🇺🇸 美国</option></select>
    <label for="levelSelect">🛡️ 保护强度</label>
    <select id="levelSelect"><option value="standard">标准（推荐）</option><option value="deep">深度</option></select>
    <span class="region-hint" id="regionHint">存在未完成事务，请先恢复</span>
  </div>`;

  html += `<div class="actions">
    <button class="btn btn-on" id="btnOn" onclick="persistOn()">🛡️ 一键切换到安全环境<small>persist on</small></button>
    <button class="btn btn-off" id="btnOff" onclick="persistOff()">🏠 一键还原日常配置<small>persist off</small></button>
    <button class="btn btn-off" id="btnRecover" style="display:none" onclick="persistRecover()">🧰 继续恢复<small>persist recover</small></button>
    <button class="btn btn-refresh" id="btnRefresh" onclick="refresh()">🔄 重新检测</button>
  </div>`;

  html += `<p style="color:var(--muted);font-size:12px;margin-top:12px">VPN、路由器、网卡、DNS、hosts 与 DoH 仅做检测和提醒，CC-Fix 不会修改这些网络配置。</p>`;

  if (recommendations.length > 0) {
    html += `<div class="recommendations"><h3>💡 修复建议</h3><ul>`;
    for (const r of recommendations) html += `<li>${r}</li>`;
    html += `</ul></div>`;
  }

  $("#content").innerHTML = html;
  loadRegions().then(loadStatus);
}

loadStatus();
loadHistory();
startCheck();
</script>
</body>
</html>
