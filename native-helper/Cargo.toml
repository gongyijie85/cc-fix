[package]
name = "cc-fix-native-helper"
version = "0.2.0-rc.2"
edition = "2024"
license = "MIT"

[dependencies]
windows-sys = { version = "0.61.0", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
] }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
